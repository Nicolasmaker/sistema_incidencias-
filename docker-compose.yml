# ==============================================================================
# Orquestacion Local de Microservicios - Sistema de Gestion de Incidencias
# En la nube se despliega con Amazon ECS Fargate + Amazon ECR + AWS CloudWatch
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: incidencias-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-BD_INCIDENCIAS}
      MYSQL_USER: ${MYSQL_USER:-incidencia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - incidencias-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-BD_INCIDENCIAS}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-incidencia}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      LOG_FORMAT: ecs
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - incidencias-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidencias-frontend
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - incidencias-net

volumes:
  mysql_data:
    driver: local

networks:
  incidencias-net:
    driver: bridge
