# ==============================================================================
# Orquestacion de Microservicios + Stack de Observabilidad (EP2 & EP3)
# Uso basico:       docker compose up -d
# Con monitoreo:    docker compose --profile observability up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Relacional (MySQL 8.0)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: incidencias-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-BD_INCIDENCIAS}
      MYSQL_USER: ${MYSQL_USER:-incidencia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - incidencias-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Microservicio Backend (Spring Boot 4 / Java 21 + Actuator/Prometheus)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidencias-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-BD_INCIDENCIAS}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-incidencia}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      LOG_FORMAT: ecs
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - incidencias-net

  # ----------------------------------------------------------------------------
  # 3. Cliente Web Frontend (Nginx Unprivileged + /healthz + /stub_status)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidencias-frontend
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - incidencias-net

  # ============================================================================
  # STACK DE OBSERVABILIDAD (Perfil: observability - IE1 & IE3)
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: incidencias-nginx-exporter
    profiles: ["observability"]
    command:
      - "--nginx.scrape-uri=http://frontend:8081/stub_status"
    depends_on:
      - frontend
    networks:
      - incidencias-net

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: incidencias-mysql-exporter
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER:-incidencia}:${MYSQL_PASSWORD:-changeme}@(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - incidencias-net

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: incidencias-pushgateway
    profiles: ["observability"]
    ports:
      - "9091:9091"
    networks:
      - incidencias-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: incidencias-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - pushgateway
    networks:
      - incidencias-net

  loki:
    image: grafana/loki:3.1.1
    container_name: incidencias-loki
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - incidencias-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: incidencias-promtail
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - incidencias-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: incidencias-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - incidencias-net

# ------------------------------------------------------------------------------
# Volumenes y Redes Aisladas
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  incidencias-net:
    driver: bridge
