spring.application.name=grupo8

# ==============================================================================
# MANEJO DE ERRORES
# ==============================================================================
spring.web.error.include-binding-errors=always
spring.web.error.include-message=${ERROR_INCLUDE_MESSAGE:always}

# ==============================================================================
# CONEXION A LA BASE DE DATOS (Externalizada por variables de entorno - IE5)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/BD_INCIDENCIAS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:incidencia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURACION JPA
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# OBSERVABILIDAD: SPRING BOOT ACTUATOR, PROMETHEUS & LOGGING ESTRUCTURADO (IE1)
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:local}
management.prometheus.metrics.export.enabled=true

# Logging estructurado en JSON (ECS) para ingesta en Loki / CloudWatch
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.sistemaIncidencias.grupo8=${LOG_LEVEL_APP:INFO}
