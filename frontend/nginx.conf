# ==============================================================================
# Configuracion Nginx Unprivileged con Healthcheck y Metricas stub_status (IE1)
# ==============================================================================

# Logs estructurados en JSON para ingesta en Loki / CloudWatch (contexto http)
log_format json_combined escape=json
  '{"time":"$time_iso8601",'
  '"service":"frontend-nginx",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # Reverse proxy hacia el Backend a traves de ECS Service Connect (mesh Envoy)
    location /api/ {
        proxy_pass http://incidencias-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de salud para Kubernetes liveness/readiness probes
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP","service":"frontend-nginx"}';
    }
}

# Puerto interno exclusivo para nginx-prometheus-exporter
server {
    listen 8081;
    server_name _;

    location /stub_status {
        stub_status on;
        access_log off;
    }
}
