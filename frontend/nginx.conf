# ==============================================================================
# Configuracion Nginx Unprivileged con Healthcheck y Metricas stub_status (IE1)
# ==============================================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs estructurados en JSON para ingesta en Loki / CloudWatch
    log_format json_combined escape=json
      '{"time":"$time_iso8601",'
      '"service":"frontend-nginx",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de salud para Kubernetes liveness/readiness probes
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP","service":"frontend-nginx"}';
    }
}

# Puerto interno exclusivo para nginx-prometheus-exporter
server {
    listen 8081;
    server_name _;

    location /stub_status {
        stub_status on;
        access_log off;
    }
}
