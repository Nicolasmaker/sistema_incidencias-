# ==============================================================================
# Configuracion de Prometheus - Monitoreo de Microservicios y CI/CD (IE1 & IE3)
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: sistema-incidencias
    environment: production-sim

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # 1. Auto-monitoreo de Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Microservicio Backend (Spring Boot Actuator + Micrometer)
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'incidencias-backend'
          tier: 'application'

  # 3. Microservicio Frontend (Nginx Exporter)
  - job_name: 'frontend'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'incidencias-frontend'
          tier: 'web'

  # 4. Base de Datos MySQL (MySQL Exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'incidencias-mysql'
          tier: 'database'

  # 5. Metricas del Pipeline CI/CD (Tiempo de despliegue, Cobertura JaCoCo, Seguridad)
  - job_name: 'cicd-pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'github-actions-cicd'
          tier: 'pipeline'
