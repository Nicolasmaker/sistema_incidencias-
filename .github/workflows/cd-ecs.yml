name: Despliegue Continuo a Amazon ECS Fargate + ECR + CloudWatch (CD) - EP3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: incidencias-ecs
  ECR_BACKEND_REPO: incidencias-backend
  ECR_FRONTEND_REPO: incidencias-frontend

jobs:
  # ============================================================================
  # 1. Validacion Pre-Despliegue (Bloqueante - IE6)
  # ============================================================================
  pre-deploy-gate:
    name: Verificacion de Cumplimiento Pre-Despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar cumplimiento antes de desplegar a produccion
        run: |
          chmod +x scripts/audit_compliance.sh
          ./scripts/audit_compliance.sh

  # ============================================================================
  # 2. Build & Push de Imagenes a Amazon ECR + Despliegue en Amazon ECS Fargate
  # ============================================================================
  deploy-ecs-cloudwatch:
    name: Build ECR & Deploy Amazon ECS Fargate + CloudWatch
    runs-on: ubuntu-latest
    needs: pre-deploy-gate

    steps:
      - name: Registrar inicio de despliegue
        id: timer
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repositorios en Amazon ECR si no existen
        run: |
          for repo in "${ECR_BACKEND_REPO}" "${ECR_FRONTEND_REPO}"; do
            aws ecr describe-repositories --region "${AWS_REGION}" --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --region "${AWS_REGION}" --repository-name "$repo" --image-scanning-configuration scanOnPush=true >/dev/null
          done

      - name: Build y Push de Backend y Frontend hacia Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          BACKEND_IMG="${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${GITHUB_SHA}"
          FRONTEND_IMG="${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${GITHUB_SHA}"

          docker build -t "$BACKEND_IMG" -t "${ECR_REGISTRY}/${ECR_BACKEND_REPO}:latest" ./backend
          docker push "$BACKEND_IMG"
          docker push "${ECR_REGISTRY}/${ECR_BACKEND_REPO}:latest"

          docker build -t "$FRONTEND_IMG" -t "${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:latest" ./frontend
          docker push "$FRONTEND_IMG"
          docker push "${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:latest"

          echo "BACKEND_IMAGE=${BACKEND_IMG}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMG}" >> "$GITHUB_ENV"

      - name: Desplegar en Amazon ECS Fargate + Service Connect + CloudWatch (IE1, IE2, IE3)
        env:
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          chmod +x scripts/deploy_ecs_aws.sh
          ./scripts/deploy_ecs_aws.sh

      - name: Esperar estabilidad de servicios en Amazon ECS
        run: |
          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${CLUSTER_NAME}" \
            --services mysql incidencias-backend incidencias-frontend

      - name: Publicar Tiempo de Despliegue en AWS CloudWatch Metrics (IE3)
        run: |
          END_TS=$(date +%s)
          DEPLOY_DURATION=$(( END_TS - ${{ steps.timer.outputs.start_ts }} ))
          echo "Tiempo total de despliegue en Amazon ECS: ${DEPLOY_DURATION}s"
          aws cloudwatch put-metric-data \
            --region "${AWS_REGION}" \
            --namespace "Incidencias/CICD" \
            --metric-name "DeployDurationSeconds" \
            --value "${DEPLOY_DURATION}" \
            --unit Seconds
