name: Integracion Continua y Cumplimiento (CI / DevSecOps) - EP3

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches:
      - main
      - develop

env:
  MIN_COVERAGE: "50"
  AWS_REGION: "us-east-1"

jobs:
  # ============================================================================
  # JOB 1: Build, Pruebas Unitarias y Cobertura JaCoCo (IE2 / IE3 / IE6)
  # ============================================================================
  build-test-coverage:
    name: Build, JUnit 5 & Cobertura JaCoCo
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.calc-coverage.outputs.coverage }}
      start_time: ${{ steps.timer.outputs.start_time }}

    steps:
      - name: Registrar tiempo de inicio
        id: timer
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Otorgar permisos al Maven Wrapper
        run: chmod +x ./backend/mvnw

      - name: Ejecutar pruebas unitarias y generar reporte JaCoCo
        working-directory: ./backend
        run: ./mvnw -B clean test

      - name: Calcular cobertura JaCoCo
        id: calc-coverage
        run: |
          COV=$(python3 - backend/target/site/jacoco/jacoco.xml <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for c in root.findall("counter"):
              if c.attrib.get("type") == "INSTRUCTION":
                  m, cov = int(c.attrib["missed"]), int(c.attrib["covered"])
                  print(f"{(cov * 100.0 / (m + cov)) if (m + cov) else 0:.2f}")
                  break
          EOF
          )
          echo "coverage=${COV}" >> "$GITHUB_OUTPUT"
          echo "Cobertura JaCoCo: ${COV}%"

      - name: Publicar artefacto JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: backend/target/site/jacoco/
          retention-days: 7

  # ============================================================================
  # JOB 2: Politicas de Cumplimiento y Auditoria Bloqueante (IE5 & IE6)
  # ============================================================================
  security-and-compliance:
    name: Quality Gates de Seguridad, Auditoria & Contenedores
    runs-on: ubuntu-latest
    needs: build-test-coverage

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar reporte JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: backend/target/site/jacoco/

      - name: Ejecutar Script de Auditoria de Cumplimiento (Bloqueante - IE5/IE6)
        run: |
          chmod +x scripts/audit_compliance.sh
          MIN_COVERAGE="${{ env.MIN_COVERAGE }}" ./scripts/audit_compliance.sh

      - name: Escaneo Trivy FS - Secretos e IaC ECS/Docker (Bloqueante - IE6)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest fs \
            --scanners secret,misconfig \
            --severity CRITICAL \
            --exit-code 1 \
            --offline-scan \
            --skip-dirs /src/Grupo8 \
            --skip-files /src/backend/pom.xml \
            /src

      - name: Analisis Snyk SCA (Bloqueante si SNYK_TOKEN esta configurado)
        if: ${{ env.SNYK_AVAILABLE == 'true' }}
        env:
          SNYK_AVAILABLE: ${{ secrets.SNYK_TOKEN != '' }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx -y snyk test --severity-threshold=high --file=backend/pom.xml

      - name: Construir imagenes Docker (Backend y Frontend)
        run: |
          docker build -t incidencias-backend:${{ github.sha }} ./backend
          docker build -t incidencias-frontend:${{ github.sha }} ./frontend

      - name: Escaneo Trivy de Imagen Docker Backend - Dependencias JAR y SO (Bloqueante - IE6)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --scanners vuln,secret \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --offline-scan \
            incidencias-backend:${{ github.sha }}

      - name: Validar Docker Compose y Definiciones Amazon ECS / CloudWatch
        run: |
          MYSQL_PASSWORD=ci-check MYSQL_ROOT_PASSWORD=ci-check docker compose config > /dev/null
          python3 -c "import glob, json; [json.load(open(f)) for f in glob.glob('ecs/*.json')]; print('Task Definitions y Dashboard CloudWatch JSON OK')"

  # ============================================================================
  # JOB 3: SonarQube / SonarCloud Quality Gate (IE5 & IE6)
  # ============================================================================
  sonarqube-quality-gate:
    name: SonarQube / SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: build-test-coverage
    if: ${{ vars.ENABLE_SONAR != 'false' }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar reporte JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: backend/target/site/jacoco/

      - name: Ejecutar Analisis SonarQube con Quality Gate Bloqueante
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN no configurado en GitHub Secrets."
            exit 0
          fi
          QG_WAIT="false"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref_name }}" = "main" ]; then
            QG_WAIT="true"
          fi
          echo "SonarCloud Quality Gate Wait: ${QG_WAIT} (evento=${{ github.event_name }}, rama=${{ github.ref_name }})"
          chmod +x ./backend/mvnw
          cd backend
          ./mvnw -B test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait="$QG_WAIT"

  # ============================================================================
  # JOB 4: Publicacion de Metricas CI/CD a AWS CloudWatch Metrics (IE3)
  # ============================================================================
  publish-cicd-metrics:
    name: Publicar Metricas CI/CD en AWS CloudWatch y Resumen
    runs-on: ubuntu-latest
    needs: [build-test-coverage, security-and-compliance, sonarqube-quality-gate]
    if: always()

    steps:
      - name: Publicar metricas en AWS CloudWatch (si hay credenciales AWS activas)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          COVERAGE: ${{ needs.build-test-coverage.outputs.coverage || '0' }}
          START_TIME: ${{ needs.build-test-coverage.outputs.start_time || '0' }}
          SEC_RESULT: ${{ needs.security-and-compliance.result }}
          SONAR_RESULT: ${{ needs.sonarqube-quality-gate.result }}
        run: |
          END_TIME=$(date +%s)
          DURATION=$(( END_TIME - START_TIME ))
          if [ "$START_TIME" -eq 0 ]; then DURATION=0; fi

          PIPELINE_OK=1
          VULNS=0
          if [ "$SEC_RESULT" != "success" ] || [ "$SONAR_RESULT" = "failure" ]; then
            PIPELINE_OK=0
            VULNS=1
          fi

          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            aws cloudwatch put-metric-data --region "${AWS_REGION}" --namespace "Incidencias/CICD" \
              --metric-data \
                "MetricName=DeployDurationSeconds,Value=${DURATION},Unit=Seconds" \
                "MetricName=TestCoveragePercent,Value=${COVERAGE},Unit=Percent" \
                "MetricName=SecurityVulnerabilities,Value=${VULNS},Unit=Count" \
                "MetricName=QualityGateStatus,Value=${PIPELINE_OK},Unit=Count" \
              || echo "::warning::No se pudo enviar metricas a CloudWatch (posible token temporal de AWS Academy expirado)."
          else
            echo "Credenciales AWS no configuradas en Secrets; metricas registradas en Job Summary."
          fi

          {
            echo "## Resumen de Metricas CI/CD y Cumplimiento — AWS CloudWatch (EP3)"
            echo "| Metrica | Valor |"
            echo "| :--- | :--- |"
            echo "| **Duracion del Pipeline** | \`${DURATION}s\` |"
            echo "| **Cobertura de Pruebas (JaCoCo)** | \`${COVERAGE}%\` (minimo: ${MIN_COVERAGE}%) |"
            echo "| **Quality Gate Seguridad y Auditoria** | \`${SEC_RESULT}\` |"
            echo "| **SonarQube Quality Gate** | \`${SONAR_RESULT}\` |"
            echo "| **Estado Final (1=Aprobado / 0=Bloqueado)** | \`${PIPELINE_OK}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
