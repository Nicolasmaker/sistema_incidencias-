name: "Terraform - Plan & Validation"

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/action-tf-plan.yaml'

permissions:
  id-token: write   # Requerido para autenticación federada OIDC con AWS
  contents: read
  pull-requests: write

jobs:
  tf-plan:
    name: "Validar y Planificar Infraestructura"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Autenticación en AWS (OIDC o Credenciales Temporales de Laboratorio)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: ⚙️ Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: 🔍 Formato de Terraform
        working-directory: ./terraform
        run: terraform fmt -check

      - name: 🚀 Inicializar Terraform
        working-directory: ./terraform
        run: terraform init

      - name: 🛡️ Validar Sintaxis de Terraform
        working-directory: ./terraform
        run: terraform validate -no-color

      - name: 📋 Generar Terraform Plan
        id: plan
        working-directory: ./terraform
        run: terraform plan -no-color -out=tfplan

      - name: 💬 Registrar Resultado en el Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Validación de Terraform: \`Exitoso\`
            * **Paso:** \`terraform plan\`
            * **Iniciador:** @${context.actor}
            * **Acción:** \`${context.eventName}\`
            
            *PULL REQUEST listo para revisión técnica.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
